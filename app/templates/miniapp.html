<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCG 18 - panou</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
</head>
<body>
<main><p id="s" class="muted">Se verifică identitatea...</p></main>
<script>
  const s = document.getElementById('s');
  const wa = window.Telegram && Telegram.WebApp;
  if (!wa || !wa.initData) {
    s.textContent = 'Deschideți panoul din bot: trimiteți /panou lui @ccg18bot.';
  } else {
    wa.ready(); wa.expand();
    fetch('/api/webapp-login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      credentials: 'include', body: JSON.stringify({initData: wa.initData})})
      .then(r => r.json().then(j => ({ok: r.ok, j})))
      .then(({ok, j}) => {
        if (ok) { location.replace('/'); }
        else { s.textContent = j.error === 'not_admin' ? 'Panoul este doar pentru conducerea asociației.' : 'Verificarea a eșuat. Redeschideți din bot.'; }
      })
      .catch(() => { s.textContent = 'Eroare de rețea. Încercați din nou.'; });
  }
</script>
</body>
</html>
